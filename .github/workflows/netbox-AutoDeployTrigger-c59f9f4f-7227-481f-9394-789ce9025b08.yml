name: Trigger auto deployment for netbox

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ release ]
    paths:
    - '**'
    - '.github/workflows/netbox-AutoDeployTrigger-c59f9f4f-7227-481f-9394-789ce9025b08.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.NETBOX_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.NETBOX_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NETBOX_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.NETBOX_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.NETBOX_REGISTRY_PASSWORD }}
          containerAppName: netbox
          resourceGroup: lab-rg
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


